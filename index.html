<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wheel of Chance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-title">The Wheel of Chance</div>
      <div class="site-tagline">Enter your choices, then let the wheel decide.</div>
    </header>

    <main class="layout">
      <!-- Left column: add and manage choices -->
      <section class="choices">
        <h1>What’s on the wheel</h1>

        <form id="add-form" class="add-row">
          <input id="choice-input" class="input" type="text" placeholder="Type a choice and press Enter" maxlength="60" autocomplete="off">
          <button id="add-btn" class="btn btn-primary" type="submit">Add</button>
        </form>

        <div id="choice-list" class="choice-list"></div>

        <div class="choices-footer">
          <span id="count" class="count"></span>
          <button id="clear-btn" class="btn btn-secondary" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Clear all
          </button>
        </div>
      </section>

      <!-- Right column: the wheel -->
      <section class="wheel-area">
        <div class="wheel-frame">
          <!-- Everything inside #wheel rotates; the pointer below stays fixed -->
          <div id="wheel" class="wheel">
            <svg class="wheel-svg" viewBox="-210 -210 420 420" aria-hidden="true">
              <circle r="206" fill="var(--color-bg)" stroke="var(--color-accent)" stroke-width="2"/>
              <g id="segments"></g>
              <circle r="196" fill="none" stroke="var(--color-accent-300)" stroke-width="1"/>
              <circle r="30" fill="var(--color-bg)" stroke="var(--color-accent)" stroke-width="2"/>
              <circle r="22" fill="none" stroke="var(--color-accent-300)" stroke-width="1"/>
            </svg>
            <div id="labels" class="wheel-labels"></div>
          </div>
          <svg class="pointer" viewBox="0 0 40 48" aria-hidden="true">
            <path d="M20 46 L4 6 Q20 0 36 6 Z" fill="var(--color-text)" stroke="var(--color-accent)" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="20" cy="10" r="3" fill="var(--color-accent)"/>
          </svg>
        </div>

        <button id="spin-btn" class="btn btn-primary spin-btn" type="button">Spin</button>

        <div id="result" class="result" aria-live="polite"></div>
      </section>
    </main>

    <canvas id="confetti" class="confetti"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
